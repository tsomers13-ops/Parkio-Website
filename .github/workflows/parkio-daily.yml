name: Parkio Daily

# Builds the daily briefing every morning. Replaces the previous
# n8n workflow — see docs/AUTOMATION.md for the full pipeline and
# scripts/parkio-daily/build.mjs for the actual logic.
#
# Schedule: runs at 11:00 UTC every day.
#   • 6 AM EST in winter (US/Eastern observes UTC-5)
#   • 7 AM EDT in summer (US/Eastern observes UTC-4)
# GitHub Actions cron only accepts a single UTC time; if you need
# exact 6 AM ET year-round, add a second cron at 10:00 UTC and have
# the script no-op when today's file already exists.

on:
  schedule:
    # Active daily trigger. NOTE: GitHub only runs scheduled workflows
    # from the repo's DEFAULT branch, and disables them after 60 days of
    # no repo activity — re-enable from the Actions tab if that happens.
    - cron: "0 11 * * *"
  # Manual trigger from the Actions tab — useful for back-fills,
  # debugging, or running an extra briefing the same day. Confirmed
  # working; this is how you run a same-day briefing on demand.
  workflow_dispatch:

# Concurrency guard — if a previous run is still going (rare; the
# build is < 3 min), cancel it so we never end up with two commits
# racing for the same date file.
concurrency:
  group: parkio-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      # Consumed by the deploy job below. Without these, a no-op day would
      # still trigger a Production deploy for no reason.
      pushed: ${{ steps.commit.outputs.pushed }}
      sha: ${{ steps.commit.outputs.sha }}
    permissions:
      # Allow the workflow to push the committed JSON back to main.
      # The default GITHUB_TOKEN is scoped per-run, no PAT needed.
      contents: write
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build today's briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/parkio-daily/build.mjs

      - name: Verify today's briefing was written
        # Fix 1: surface a missing-file outage immediately instead of
        # letting the run "succeed" with nothing produced.
        run: |
          today=$(TZ=America/New_York date +%Y-%m-%d)
          f="content/guide/daily/parkio-daily-${today}.json"
          if [ ! -f "$f" ]; then
            echo "::error::Expected $f was not produced by build.mjs."
            exit 1
          fi
          echo "Found $f — a commit should be created."

      - name: Generate social drafts
        # Reformats today's briefing into ready-to-post social drafts at
        # content/social/{slug}.md. Zero API cost (no Claude call). Marked
        # non-fatal so a drafting hiccup can never block the briefing commit.
        run: node scripts/parkio-daily/social.mjs || echo "social drafts step skipped (non-fatal)"

      - name: Commit the new briefing
        id: commit
        run: |
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          git config user.name "parkio-daily-bot"
          git config user.email "parkio-daily-bot@users.noreply.github.com"
          git add content/guide/daily/ content/social/
          if git diff --cached --quiet; then
            echo "No content changes — nothing to commit."
            exit 0
          fi
          today=$(TZ=America/New_York date +%Y-%m-%d)
          git commit -m "Parkio Daily — ${today}"
          # The remote main may have advanced since checkout (manual pushes,
          # a prior run). A plain push then fails with non-fast-forward
          # ([rejected] fetch first), which is what silently stopped the bot
          # from committing. Rebase our single new-file commit onto the
          # latest remote, then push. --autostash keeps it safe if anything
          # is dirty; the dated JSON file won't conflict with other work.
          git pull --rebase --autostash origin main
          git push origin HEAD:main
          # Hand the exact pushed SHA to the deploy job. Deploying a moving
          # ref could publish a different commit than the one just verified.
          {
            echo "pushed=true"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

  # Publish the commit just made.
  #
  # This job exists because GitHub does not run workflows for pushes made with
  # the default GITHUB_TOKEN, so the push above will NOT trigger any
  # push-triggered workflow on its own. /feed.xml and the Daily guide pages
  # are static build artifacts (export const dynamic = "force-static" in
  # app/feed.xml) — without this job, the commit above would sit invisible
  # to the public site and to Buttondown's RSS poll until some unrelated
  # future deploy happened to include it. See the Oct 2 / Oct 6
  # delayed-newsletter RCA for exactly that failure.
  #
  # This calls parkio-daily-publish.yml — a separate, narrowly-scoped
  # workflow — NOT workers-production.yml. The two are deliberately
  # different workflows with different concurrency groups and different
  # approval models:
  #   - workers-production.yml: application releases, triggered only by an
  #     explicit production-release-* tag or workflow_dispatch, gated by the
  #     `production` environment's required reviewer. Unchanged by this.
  #   - parkio-daily-publish.yml: Daily content only, no human approval,
  #     but mechanically incapable of publishing anything outside the Daily
  #     content allowlist or anything an application reviewer hasn't
  #     already approved — see that workflow's own comments and
  #     scripts/parkio-daily/validatePublishCandidate.mjs for how.
  # Routing Daily content through the application-release gate is exactly
  # what caused the delay in the first place; it must never go back to that.
  publish:
    name: Publish Daily content
    needs: build
    if: needs.build.outputs.pushed == 'true'
    # `${{ secrets.X }}` below resolves in THIS job's own scope before being
    # forwarded to the called workflow — without this environment declared
    # here too, these three secrets (which live only in the daily-publish
    # and production environments, not at repo level) would resolve empty
    # and get silently forwarded as blank values. Must match the called
    # workflow's own `environment: daily-publish` job declaration.
    environment: daily-publish
    uses: ./.github/workflows/parkio-daily-publish.yml
    with:
      sha: ${{ needs.build.outputs.sha }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_CARTO_API_KEY: ${{ secrets.NEXT_PUBLIC_CARTO_API_KEY }}
