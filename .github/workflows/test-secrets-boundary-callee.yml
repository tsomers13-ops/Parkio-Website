name: TEST Secrets Boundary Callee (temporary — not part of normal operation)

# Called only by test-secrets-boundary-caller.yml. Declares the exact
# same three secrets, under the exact same `on.workflow_call.secrets`
# contract, as the real parkio-daily-publish.yml — this is deliberate:
# the whole point is to exercise the real contract shape, not an
# approximation of it.
#
# The job below does exactly one thing: report, for each of the three
# secrets, whether it arrived non-empty. It never prints a value, a
# length, or any other value-derived data — only the literal words
# "present" or "MISSING". No checkout, no npm install, no wrangler call
# of any kind, no lock script, no write of any kind.

on:
  workflow_call:
    secrets:
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      CLOUDFLARE_API_TOKEN:
        required: true
      NEXT_PUBLIC_CARTO_API_KEY:
        required: true

jobs:
  probe:
    name: Check credential presence via the daily-publish environment
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # The real environment under real test — this is what makes the
    # result meaningful. Read-only from this job's point of view: it
    # never calls any Cloudflare API, so nothing here can mutate
    # anything Cloudflare-side even in principle.
    environment: daily-publish
    steps:
      - name: Report presence only — never a value, never a length
        run: |
          ok=true
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN NEXT_PUBLIC_CARTO_API_KEY; do
            val="${!name:-}"
            if [ -z "$val" ]; then
              echo "::error::$name is MISSING"
              ok=false
            else
              echo "$name: present"
            fi
          done
          if [ "$ok" != "true" ]; then
            echo "::error::One or more required Cloudflare credentials did not reach this job through the reusable-workflow boundary."
            exit 1
          fi
          echo "All three required Cloudflare credentials reached this job via the daily-publish environment."
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEXT_PUBLIC_CARTO_API_KEY: ${{ secrets.NEXT_PUBLIC_CARTO_API_KEY }}
