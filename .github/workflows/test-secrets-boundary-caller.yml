name: TEST Secrets Boundary Caller (temporary — not part of normal operation)

# Temporary, read-only credential-presence probe for the exact
# caller/callee secrets-forwarding shape PR #20 fixed in
# parkio-daily.yml -> parkio-daily-publish.yml. Mirrors that real fix's
# shape exactly — same `daily-publish` environment, same three secret
# names, same named-forwarding style — but the callee it points to does
# nothing except report whether each secret arrived. It never calls
# wrangler in any form, never touches productionDeployLock.mjs, never
# generates or commits Daily content, never modifies any GitHub secret
# or environment.
#
# Exists to get a live, verified answer — not an assumption from reading
# GitHub's docs — to "do all three Cloudflare secrets actually reach the
# reusable workflow's job," before trusting PR #20's fix with a real
# Daily publish attempt.
#
# workflow_dispatch only: can never fire on a schedule or a push. Delete
# this file and its callee once the answer is confirmed either way.

on:
  workflow_dispatch:

jobs:
  probe:
    name: Probe secrets boundary
    uses: ./.github/workflows/test-secrets-boundary-callee.yml
    secrets:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NEXT_PUBLIC_CARTO_API_KEY: ${{ secrets.NEXT_PUBLIC_CARTO_API_KEY }}
